# ─────────────────────────────────────────────────────────────────────────────
# PP-AI — GitLab CI/CD Pipeline
#
# Stages
#   test    → typecheck + unit tests        (todos los branches y MRs)
#   build   → docker build + push a Harbor  (solo main y tags)
#   deploy  → genera .env + reinicia server (manual, solo main y tags)
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ VARIABLES requeridas en GitLab → Settings → CI/CD → Variables          │
# │                                                                         │
# │ ── Harbor ──────────────────────────────────────────────────────────── │
# │  HARBOR_URL          Variable  no-mask   harbor.example.com             │
# │  HARBOR_PROJECT      Variable  no-mask   pp-ai                          │
# │  HARBOR_USER         Variable  no-mask   robot$pp-ai+ci                 │
# │  HARBOR_PASSWORD     Variable  MASK+PROT <robot secret>                 │
# │                                                                         │
# │ ── Deploy SSH ──────────────────────────────────────────────────────── │
# │  DEPLOY_HOST         Variable  no-mask   10.0.0.50 o prod.app.com       │
# │  DEPLOY_USER         Variable  no-mask   ubuntu                         │
# │  DEPLOY_PATH         Variable  no-mask   /opt/pp-ai                     │
# │  DEPLOY_SSH_KEY      File      MASK+PROT <clave privada SSH>            │
# │                                                                         │
# │ ── Base de datos (producción) ──────────────────────────────────────── │
# │  DB_NAME             Variable  no-mask   ppai                           │
# │  DB_USER             Variable  no-mask   ppai                           │
# │  DB_PASSWORD         Variable  MASK+PROT <password prod>                │
# │                                                                         │
# │ ── Autenticación ───────────────────────────────────────────────────── │
# │  JWT_SECRET          Variable  MASK+PROT <string aleatorio largo>       │
# │                                                                         │
# │ ── App URLs (producción) ───────────────────────────────────────────── │
# │  FRONTEND_URL        Variable  no-mask   https://pp-ai.example.com      │
# │  FRONTEND_PORT       Variable  no-mask   80                             │
# │                                                                         │
# │ ── Email ───────────────────────────────────────────────────────────── │
# │  ENABLE_EMAIL        Variable  no-mask   true                           │
# │  SMTP_FROM           Variable  no-mask   PP-AI                          │
# │  SMTP_HOST           Variable  no-mask   smtp.example.com               │
# │  SMTP_PORT           Variable  no-mask   587                            │
# │  SMTP_SECURE         Variable  no-mask   false                          │
# │  SMTP_USER           Variable  no-mask   noreply@example.com            │
# │  SMTP_PASS           Variable  MASK      <app password gmail>           │
# │                                                                         │
# │ ── Google OAuth ────────────────────────────────────────────────────── │
# │  GOOGLE_CLIENT_ID    Variable  no-mask   <your-google-client-id>        │
# │  GOOGLE_CLIENT_SECRET Variable MASK      <your-google-client-secret>   │
# │  GOOGLE_CALLBACK_URL Variable  no-mask   https://.../api/auth/google/cb │
# │                                                                         │
# │ ── Keycloak SSO ────────────────────────────────────────────────────── │
# │  KEYCLOAK_URL           Variable no-mask  http://keycloak:8080          │
# │  KEYCLOAK_PUBLIC_URL    Variable no-mask  https://keycloak.example.com  │
# │  KEYCLOAK_REALM         Variable no-mask  ppai                          │
# │  KEYCLOAK_CLIENT_ID     Variable no-mask  ppai-app                      │
# │  KEYCLOAK_CLIENT_SECRET Variable MASK+PROT <client secret>              │
# │  KEYCLOAK_CALLBACK_URL  Variable no-mask  https://.../keycloak/callback │
# │                                                                         │
# │ ── Keycloak Admin ──────────────────────────────────────────────────── │
# │  KC_ADMIN_USER       Variable  no-mask   admin                          │
# │  KC_ADMIN_PASSWORD   Variable  MASK      <admin password>               │
# │  KC_DB_USER          Variable  no-mask   keycloak                       │
# │  KC_DB_PASSWORD      Variable  MASK+PROT <keycloak db password>         │
# └─────────────────────────────────────────────────────────────────────────┘
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - test
  - build
  - gitops

# ── Variables globales ────────────────────────────────────────────────────────
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE:  "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-backend"
  FRONTEND_IMAGE: "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-frontend"

.prod_runner:
  tags:
    - k8s-prod-tr-hq

# ── Reglas reutilizables ──────────────────────────────────────────────────────
.rules_always:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.rules_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ── Template Docker-in-Docker ─────────────────────────────────────────────────
.docker_job:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" -u "$HARBOR_USER" --password-stdin

# ══════════════════════════════════════════════════════════════════════════════
# STAGE: test
# ══════════════════════════════════════════════════════════════════════════════

test:backend:
  stage: test
  extends: .rules_always
  image: node:22-alpine
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths: [backend/node_modules/]
  script:
    - cd backend
    - npm ci
    - npm run typecheck
    - npm test

test:frontend:
  stage: test
  extends: .rules_always
  image: node:22-alpine
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci
    - npm run typecheck
    - npm test

# ══════════════════════════════════════════════════════════════════════════════
# STAGE: build  (solo main / tags)
# ══════════════════════════════════════════════════════════════════════════════

build:backend:
  stage: build
  extends:
    - .rules_main
    - .docker_job
    - .prod_runner
  script:
    - |
      TAGS="-t ${BACKEND_IMAGE}:${CI_COMMIT_SHA} -t ${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
      [ "$CI_COMMIT_BRANCH" = "main" ] && TAGS="${TAGS} -t ${BACKEND_IMAGE}:latest"
      [ -n "$CI_COMMIT_TAG" ] && TAGS="${TAGS} -t ${BACKEND_IMAGE}:${CI_COMMIT_TAG} -t ${BACKEND_IMAGE}:latest"
      docker pull "${BACKEND_IMAGE}:latest" 2>/dev/null || true
      DOCKER_BUILDKIT=1 docker build --cache-from "${BACKEND_IMAGE}:latest" ${TAGS} ./backend
      docker push --all-tags "${BACKEND_IMAGE}"

build:frontend:
  stage: build
  extends:
    - .rules_main
    - .docker_job
    - .prod_runner
  script:
    - |
      TAGS="-t ${FRONTEND_IMAGE}:${CI_COMMIT_SHA} -t ${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
      [ "$CI_COMMIT_BRANCH" = "main" ] && TAGS="${TAGS} -t ${FRONTEND_IMAGE}:latest"
      [ -n "$CI_COMMIT_TAG" ] && TAGS="${TAGS} -t ${FRONTEND_IMAGE}:${CI_COMMIT_TAG} -t ${FRONTEND_IMAGE}:latest"
      docker pull "${FRONTEND_IMAGE}:latest" 2>/dev/null || true
      DOCKER_BUILDKIT=1 docker build --cache-from "${FRONTEND_IMAGE}:latest" ${TAGS} ./frontend
      docker push --all-tags "${FRONTEND_IMAGE}"

update:manifests:
  stage: gitops
  extends: .rules_main
  image: alpine:3.20
  variables:
    GIT_TERMINAL_PROMPT: "0"
  before_script:
    - apk add --no-cache git bash curl
    # Instalar yq v4 (mikefarah) explícitamente
    - YQ_VERSION="v4.44.3"
    - curl -L "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
    - chmod +x /usr/local/bin/yq
    - yq --version
    - git config --global user.email "ci@gitlab"
    - git config --global user.name "gitlab-ci"
  script:
    - |
      set -euo pipefail

      # 1) Tag a desplegar
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHA"
      fi
      echo "Deploying tag: $IMAGE_TAG"

      # 2) Clonar GitOps repo
      AUTH_URL="$(echo "$GITOPS_REPO_URL" | sed "s#https://#https://oauth2:${GITOPS_TOKEN}@#")"
      git clone --depth 1 --branch "$GITOPS_TARGET_BRANCH" "$AUTH_URL" gitops
      cd gitops

      OVERLAY_FILE="${GITOPS_PATH_OVERLAY}/kustomization.yaml"
      test -f "$OVERLAY_FILE" || (echo "ERROR: no existe $OVERLAY_FILE" && exit 1)

      # 3) Actualizar tags
      yq -i '
        (.images[] | select(.name == "registry-nonprod.tigocloud.net/pp-ai/pp-ai-backend")).newTag = strenv(IMAGE_TAG) |
        (.images[] | select(.name == "registry-nonprod.tigocloud.net/pp-ai/pp-ai-frontend")).newTag = strenv(IMAGE_TAG)
      ' "$OVERLAY_FILE"

      echo "Resultado images:"
      yq '.images' "$OVERLAY_FILE"

      # 4) Commit & push
      git add "$OVERLAY_FILE"
      git commit -m "pp-ai: deploy ${IMAGE_TAG} from ${CI_PROJECT_PATH}@${CI_COMMIT_SHA} [skip ci]" || {
        echo "No changes to commit"
        exit 0
      }
      git push origin "$GITOPS_TARGET_BRANCH"