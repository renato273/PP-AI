# ─────────────────────────────────────────────────────────────────────────────
# PP-AI — GitLab CI/CD Pipeline (FIX para Harbor/Trivy)
#
# Cambios clave:
# - NO usar `docker push --all-tags`
# - Tags explícitos y tag inmutable CI_COMMIT_SHA (recomendado para escaneo)
# - buildcache para cache estable
# - GitOps sin hardcode del registry en yq: usa BACKEND_IMAGE y FRONTEND_IMAGE
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - test
  - build
  - gitops

# ── Variables globales ────────────────────────────────────────────────────────
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

  BACKEND_IMAGE:        "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-backend"
  FRONTEND_IMAGE:       "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-frontend"

  BACKEND_CACHE_IMAGE:  "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-backend-cache"
  FRONTEND_CACHE_IMAGE: "${HARBOR_URL}/${HARBOR_PROJECT}/pp-ai-frontend-cache"

# Runner
.prod_runner:
  tags:
    - k8s-prod-tr-hq

# ── Reglas reutilizables ──────────────────────────────────────────────────────
.rules_always:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.rules_main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ── Template Docker-in-Docker ─────────────────────────────────────────────────
.docker_job:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
      # Si tu Harbor usa certificado self-signed o no confiable por Docker,
      # descomenta la siguiente línea:
      # command: ["--insecure-registry=registry-nonprod.tigocloud.net"]
  before_script:
    - set -euo pipefail
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" -u "$HARBOR_USER" --password-stdin

# ══════════════════════════════════════════════════════════════════════════════
# STAGE: test
# ══════════════════════════════════════════════════════════════════════════════

test:backend:
  stage: test
  extends: .rules_always
  image: node:22-alpine
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - backend/node_modules/
  script:
    - set -euo pipefail
    - cd backend
    - npm ci
    - npm run typecheck
    - npm test

test:frontend:
  stage: test
  extends: .rules_always
  image: node:22-alpine
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/node_modules/
  script:
    - set -euo pipefail
    - cd frontend
    - npm ci
    - npm run typecheck
    - npm test

# ══════════════════════════════════════════════════════════════════════════════
# STAGE: build  (solo main / tags)
# ══════════════════════════════════════════════════════════════════════════════

build:backend:
  stage: build
  extends:
    - .rules_main
    - .docker_job
    - .prod_runner
  script:
    - |
      set -euo pipefail

      # Cache separado (no ensucia el repo "real")
      docker pull "${BACKEND_CACHE_IMAGE}:buildcache" 2>/dev/null || true

      DOCKER_BUILDKIT=1 docker build \
        --cache-from "${BACKEND_CACHE_IMAGE}:buildcache" \
        -t "${BACKEND_IMAGE}:${CI_COMMIT_SHA}" \
        -t "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}" \
        ./backend

      # latest solo como puntero
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker tag "${BACKEND_IMAGE}:${CI_COMMIT_SHA}" "${BACKEND_IMAGE}:latest"
      fi

      # release tag (si existe)
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "${BACKEND_IMAGE}:${CI_COMMIT_SHA}" "${BACKEND_IMAGE}:${CI_COMMIT_TAG}"
        docker tag "${BACKEND_IMAGE}:${CI_COMMIT_SHA}" "${BACKEND_IMAGE}:latest"
      fi

      # Push explícito (sin --all-tags)
      docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHA}"
      docker push "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"

      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker push "${BACKEND_IMAGE}:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker push "${BACKEND_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${BACKEND_IMAGE}:latest"
      fi

      # Publica cache separado
      docker tag "${BACKEND_IMAGE}:${CI_COMMIT_SHA}" "${BACKEND_CACHE_IMAGE}:buildcache"
      docker push "${BACKEND_CACHE_IMAGE}:buildcache"

build:frontend:
  stage: build
  extends:
    - .rules_main
    - .docker_job
    - .prod_runner
  script:
    - |
      set -euo pipefail

      docker pull "${FRONTEND_CACHE_IMAGE}:buildcache" 2>/dev/null || true

      DOCKER_BUILDKIT=1 docker build \
        --cache-from "${FRONTEND_CACHE_IMAGE}:buildcache" \
        -t "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}" \
        -t "${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}" \
        ./frontend

      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker tag "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}" "${FRONTEND_IMAGE}:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}" "${FRONTEND_IMAGE}:${CI_COMMIT_TAG}"
        docker tag "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}" "${FRONTEND_IMAGE}:latest"
      fi

      docker push "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}"
      docker push "${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}"

      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker push "${FRONTEND_IMAGE}:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker push "${FRONTEND_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${FRONTEND_IMAGE}:latest"
      fi

      docker tag "${FRONTEND_IMAGE}:${CI_COMMIT_SHA}" "${FRONTEND_CACHE_IMAGE}:buildcache"
      docker push "${FRONTEND_CACHE_IMAGE}:buildcache"

# ══════════════════════════════════════════════════════════════════════════════
# STAGE: gitops  (solo main / tags)
# ══════════════════════════════════════════════════════════════════════════════

update:manifests:
  stage: gitops
  extends: .rules_main
  image: alpine:3.20
  variables:
    GIT_TERMINAL_PROMPT: "0"
  needs:
    - job: build:backend
    - job: build:frontend
  before_script:
    - set -euo pipefail
    - apk add --no-cache git bash curl
    - YQ_VERSION="v4.44.3"
    - curl -L "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
    - chmod +x /usr/local/bin/yq
    - yq --version
    - git config --global user.email "ci@gitlab"
    - git config --global user.name "gitlab-ci"
  script:
    - |
      set -euo pipefail

      # Deploy tag: usa release tag si existe, si no usa SHA inmutable
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHA"
      fi
      export IMAGE_TAG

      echo "Deploying tag: ${IMAGE_TAG}"
      echo "Backend image name: ${BACKEND_IMAGE}"
      echo "Frontend image name: ${FRONTEND_IMAGE}"

      AUTH_URL="$(echo "$GITOPS_REPO_URL" | sed "s#https://#https://oauth2:${GITOPS_TOKEN}@#")"
      git clone --depth 1 --branch "$GITOPS_TARGET_BRANCH" "$AUTH_URL" gitops
      cd gitops

      OVERLAY_FILE="${GITOPS_PATH_OVERLAY}/kustomization.yaml"
      test -f "$OVERLAY_FILE" || (echo "ERROR: no existe $OVERLAY_FILE" && exit 1)

      # Actualiza tags para las imágenes (sin hardcode)
      yq -i '
        (.images[] | select(.name == strenv(BACKEND_IMAGE))).newTag = strenv(IMAGE_TAG) |
        (.images[] | select(.name == strenv(FRONTEND_IMAGE))).newTag = strenv(IMAGE_TAG)
      ' "$OVERLAY_FILE"

      echo "Resultado images:"
      yq '.images' "$OVERLAY_FILE"

      git add "$OVERLAY_FILE"
      git commit -m "pp-ai: deploy ${IMAGE_TAG} from ${CI_PROJECT_PATH}@${CI_COMMIT_SHA} [skip ci]" || exit 0
      git push origin "$GITOPS_TARGET_BRANCH"